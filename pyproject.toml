[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr_report_decision_agent"
version = "0.1.0"
description = "Auditable decision agent for chest X-ray report findings"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maryam Tavasoli" }]
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B007", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
